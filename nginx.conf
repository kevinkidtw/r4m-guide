# 機關王 R4M 程式說明站 (r4m-guide) — 純靜態服務
# 通行碼保護由外層 ccmtc-portal 的 Next.js middleware 統一控管。
# 本容器僅在 Docker 內網 expose 80，不對公網開埠。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 本站掛在官網的 /r4m 底下，nginx 自動發送的 301 若帶絕對網址，
    # 會洩漏容器內部位址並脫離 /r4m 前綴。一律強制停用絕對重新導向。
    absolute_redirect off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml font/woff2;

    # 1. 樣式與腳本：配合雜湊快取破壞，每次均需向伺服器確認（304 快速回應）
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 2. 圖片與字型：靜態長效快取 30 天
    location ~* \.(woff2|jpg|jpeg|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 3. 原始碼與離線壓縮下載檔：強制瀏覽器下載附件，避免內嵌顯示
    location ~* \.(ts|zip|md)$ {
        # .ts 預設會被當成影片 (video/mp2t)，改成純文字原始碼
        types { application/zip zip; }
        default_type text/plain;
        charset utf-8;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 4. 預設路由與 HTML 頁面：確保每次請求均經重新驗證
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        # 先找 $uri/index.html 再找 $uri/：官網 rewrite 會把「資料夾/」的結尾斜線吃掉，
        # 若讓 nginx 回 301 補斜線，導向會脫離官網的 /<站> 前綴（例：/squid/materials/ → /materials/）。
        try_files $uri $uri/index.html $uri/ =404;
    }
}
